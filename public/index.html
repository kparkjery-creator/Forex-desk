<script>
  (function () {
    var titles = {
      board: "Market overview",
      charts: "Market charts",
      sessions: "Session drivers",
      setup: "Gold Daily Setup",
      calendar: "Market calendar",
      inst: "Institutional desk",
      confluence: "Macro–technical confluence",
      vol100: "Volatility 100 desk",
      goldstudy: "Gold study desk",
      headlines: "Headlines"
    };

    document.querySelectorAll("aside .tab").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var tabBtn = e.currentTarget;
        var tabId = tabBtn.getAttribute("data-tab");
        if (!tabId) return;

        document.querySelectorAll("aside .tab").forEach(function (b) {
          b.classList.remove("on");
        });
        document.querySelectorAll("main .panel").forEach(function (p) {
          p.classList.remove("on");
        });

        tabBtn.classList.add("on");
        var panel = document.getElementById(tabId);
        if (panel) panel.classList.add("on");

        var heading = document.getElementById("title");
        if (heading) heading.textContent = titles[tabId] || tabBtn.textContent.trim();

        if (tabId === "vol100") {
          var f = document.getElementById("v100-frame");
          if (f && !f.src && f.dataset.src) f.src = f.dataset.src;
        } else if (tabId === "goldstudy") {
          var g = document.getElementById("gold-frame");
          if (g && !g.src && g.dataset.src) g.src = g.dataset.src;
        } else if (tabId === "headlines") {
          var h = document.getElementById("hl-frame");
          if (h && !h.src && h.dataset.src) h.src = h.dataset.src;
        } else if (tabId === "charts") {
          var tv = document.getElementById("tv");
          if (tv && !tv.querySelector("iframe")) {
            tv.innerHTML = '<iframe title="chart" src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=15&theme=dark&style=1&timezone=Africa%2FJohannesburg" style="width:100%;height:100%;border:0" allowfullscreen></iframe>';
          }
        }
      });
    });
  })();
</script>
